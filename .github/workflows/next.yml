name: Publish Package to npmjs
on:
  push:
    branches:
      - alpha
      - next
      - v4x
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # resolve version: use the workflow run number as the build suffix
      - run: |
          set -x
          VERLOC=$(cat package.json | jq -r '.["version"]')
          jq -r '.version = "'${VERLOC}'-build.'${GITHUB_RUN_NUMBER}'"' package.json > /tmp/package.json && mv /tmp/package.json ./package.json
      - run: npm publish --tag ${GITHUB_REF##*/} --access public
